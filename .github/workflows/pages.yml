# S29: build the website (web/) with the real data (data/processed/) and publish it on GitHub Pages.
# Runs on every push to main that changes the site or its data, or by hand (Actions tab -> Deploy website -> Run workflow).
# One-time setting: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/processed/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Forecast, Nightly data refresh]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # type check + build; copies data/processed into dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
