# Experimental 7-day forecast of the harmonized daily count, with Yashneil's Timestral-5M method
# (pipeline/07_forecast.py). Needs internet for the model, so it runs here and not in the pipeline sessions.
# It writes data/processed/regions/US-CA/forecast.json and commits it to the branch it ran on.
name: Forecast

on:
  push:
    paths: ['pipeline/07_forecast.py', 'data/processed/regions/US-CA/daily.json', '.github/workflows/forecast.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: califire-data-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies (same versions as yashneil75/califire)
        run: |
          python -m pip install numpy
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff'
      - name: Backtest and forecast on the harmonized daily count
        run: python pipeline/07_forecast.py --region US-CA
      - name: Commit the forecast file
        run: |
          set -euo pipefail
          git config user.name "califire forecast bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/regions/US-CA/forecast.json
          if git diff --cached --quiet; then echo "Forecast unchanged."; exit 0; fi
          git commit -m "Experimental forecast on the harmonized daily count ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
