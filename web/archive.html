<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Califire: harmonized MODIS and VIIRS fire hotspot history for California, 2000 to 2026." />
    <title>Archive · Califire</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,650;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body data-page="archive">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar" id="topbar"></header>
    <div id="area-bar" class="area-bar"></div>
    <div id="sample-banner" class="banner" role="status" hidden></div>
    <div id="status" class="status" role="alert" hidden></div>

    <main id="main" class="wrap page" tabindex="-1">
      <section class="page-hero">
        <h1 class="page-title">Every year<br />since <em>2000</em>.</h1>
        <p class="lede">Years by months, one matrix: the burning activity calendar. Switch the colours between counts, percentile and anomaly; select a cell to narrow the dates to that month.</p>
      </section>
      <div class="layout">
        <aside class="sidebar" aria-label="Selection">
          <details class="sel-box" id="sel-box" open>
            <summary id="sel-summary">Dates and area</summary>
            <section id="controls" class="panel"></section>
          </details>
        </aside>
        <div class="content">
          <section id="calendar" class="panel" aria-label="Burning activity calendar"></section>
        </div>
      </div>
    </main>

    <footer class="wrap footer" id="footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
