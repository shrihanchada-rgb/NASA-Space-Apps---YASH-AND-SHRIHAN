<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Califire: harmonized MODIS and VIIRS hotspot history by region and date." />
    <title>Califire · California fire activity calendar</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="appbar">
      <div class="appbar-inner">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2.5c.6 3.2-1.2 5-2.6 6.6C8 10.7 7 12.3 7 14.6A5 5 0 0 0 12 19.5a5 5 0 0 0 5-4.9c0-2.4-1.3-4-2.3-5.4-.3 1.3-1 2.2-2 2.7.4-3.7-.2-6.6-.7-9.4Z" fill="currentColor" />
            <path d="M5 21.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
          </svg>
          <div>
            <p class="brand-name">Califire</p>
            <p class="brand-sub">California fire activity, 2000 to 2026</p>
          </div>
        </div>
        <nav class="appnav" aria-label="Pages"><a href="./methods.html">Methods &amp; limits</a></nav>
        <div id="data-status" class="data-status" aria-live="polite"></div>
      </div>
    </header>

    <div id="sample-banner" class="banner" role="status" hidden></div>
    <div id="status" class="status" role="alert" hidden></div>

    <div class="layout">
      <aside class="sidebar" aria-label="Selection">
        <section id="controls" class="panel"></section>
      </aside>

      <main id="main" class="content" tabindex="-1">
        <section id="summary" class="summary" aria-live="polite" aria-label="Summary"></section>

        <section class="panel" aria-labelledby="map-title">
          <div class="panel-head">
            <h2 id="map-title">Map</h2>
            <div id="map-tools" class="map-tools"></div>
          </div>
          <div id="map" class="map" role="region" aria-label="Map of the selected region"></div>
          <p id="map-note" class="note map-note"></p>
        </section>

        <section id="calendar" class="panel" aria-label="Burning activity calendar"></section>
        <section id="charts" class="panel" aria-label="Charts"></section>
        <section id="compare" class="panel" aria-label="Compare with past years"></section>
        <section id="downloads" class="panel" aria-label="Downloads"></section>
      </main>
    </div>

    <footer class="site-footer">
      <p id="footer"></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
